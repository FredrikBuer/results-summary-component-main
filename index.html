<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="result-wrapper">
    <h1 class="your-result-title">Your Result</h1>
    <div class="score-wrapper">
      <p class="your-score">76</p>
      <p class="max-score">of 100</p>
    </div>
    <p class="score-evaluation">Great</p>
    <p class="score-text">You scored higher than 65% of the people who have taken these tests.</p>
  </div>
  <div class="summary-wrapper">
    <h1 class="summary-title">Summary</h1>
    <div class="reaction-container">
      <img class="reaction-img" src="assets/images/icon-reaction.svg" alt="Image referencing reaction score">
      <p class="reaction-text">Reaction</p>
      <p class="reaction-score">80</p>
      <p class="reaction-max"> / 100</p>
    </div>
    <div class="memory-container">
      <img class="memory-img" src="assets/images/icon-memory.svg" alt="Image referencing memory score">
      <p class="memory-text">Memory</p>
      <p class="memory-score">92</p>
      <p class="memory-max"> / 100</p>
    </div>
    <div class="verbal-container">
      <img class="verbal-img" src="assets/images/icon-verbal.svg" alt="Image referencing verbal score">
      <p class="verbal-text">Verbal</p>
      <p class="verbal-score">61</p>
      <p class="verbal-max"> / 100</p>
    </div>
    <div class="visual-container">
      <img class="visual-img" src="assets/images/icon-visual.svg" alt="Image referencing visual score">
      <p class="visual-text">Visual</p>
      <p class="visual-score">73</p>
      <p class="visual-max"> / 100</p>
    </div>
  </div>
  <button class="continue-button">Continue</button>
  </div>
</body>

</html>
